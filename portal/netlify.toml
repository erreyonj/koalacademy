[build]
  base = "portal"
  command = "npm run build"
  publish = "out"

# NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY are set in the
# Netlify UI (Site settings > Environment variables) — they are publishable
# browser values, not secrets, but they still don't belong in git.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # connect-src carries Salad Bowl (and future game) traffic: Supabase REST,
    # Auth, Edge Functions over https, Realtime over wss; Turnstile challenge
    # API. 'unsafe-inline' for script/style is required by Next.js static-export
    # hydration and Tailwind's inline style attributes; frame-src covers the
    # click-to-load YouTube player on lesson slides and the Turnstile iframe.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://qthafgqbfsnuomqqgyyc.supabase.co wss://qthafgqbfsnuomqqgyyc.supabase.co https://challenges.cloudflare.com; frame-src https://www.youtube-nocookie.com https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
